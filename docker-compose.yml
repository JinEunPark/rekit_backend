services:
  postgres:
    image: postgres:15-alpine
    container_name: rekle-postgres
    environment:
      POSTGRES_USER: rekle
      POSTGRES_PASSWORD: rekle
      POSTGRES_DB: rekle
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekle"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rekle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: rekle-seaweedfs
    command: >
      server
      -dir=/data
      -master.volumeSizeLimitMB=1024
      -volume.max=10
      -filer
      -s3
      -s3.config=/config/s3_config.json
    ports:
      - "9333:9333"   # master
      - "8080:8080"   # volume
      - "8888:8888"   # filer
      - "8333:8333"   # s3 gateway
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/s3_config.json:/config/s3_config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: rekle-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rekle:rekle@postgres:5432/rekle
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
