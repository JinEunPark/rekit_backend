# docker 기본 json-file 드라이버는 용량 제한이 없어 로그가 디스크를 채운다 → 컨테이너당 최대 20MB×5개.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    container_name: rekle-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: rekle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rekle
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # pg_stat_statements — 쿼리별 호출 수·평균 시간 (N+1·느린 쿼리 식별). preload 는 서버 시작 때만
    # 읽혀서 이 값을 바꾸면 컨테이너 재생성(=Postgres 재시작)이 필요하다. 확장 생성은 alembic 마이그레이션
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    # SSH 터널(ssh -L 5432:localhost:5432)로만 접근 — loopback 바인딩이라 외부/LAN 직접 노출 없음
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekle"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rekle-redis
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Deploy 파이프라인이 IMAGE_TAG 로 배포할 git 태그(X.Y.Z)를 주입한다. 롤백은 이전 태그 지정.
    image: 127.0.0.1:5000/rekit-backend:${IMAGE_TAG:-latest}
    container_name: rekle-app
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://rekle:${POSTGRES_PASSWORD}@postgres:5432/rekle
      REDIS_URL: redis://redis:6379/0
      # 엣지 nginx 가 docker 네트워크(rekit_edge)의 자기 컨테이너 IP 로 접속하므로 gunicorn
      # 기본값(127.0.0.1)으론 X-Forwarded-Proto 를 신뢰하지 않는다 → HTTPS 뒤에서도
      # request.url.scheme 이 http 로 잡혀 트레일링 슬래시 등 리다이렉트가 http:// Location
      # 을 만들어 스킴 다운그레이드 발생. app 8000 은 loopback 바인딩(외부 미노출)이고 nginx
      # 만 접근하므로 "*" 로 열어도 안전. (gunicorn 이 이 env 를 --forwarded-allow-ips 로 읽음)
      FORWARDED_ALLOW_IPS: "*"
      # Sentry release — 어느 배포 태그부터 에러가 시작됐는지 추적
      APP_VERSION: ${IMAGE_TAG:-unknown}
      # S3_ENDPOINT_URL은 여기서 고정하지 않고 .env(secrets/rekit_backend.env)를 그대로 씀.
      # presigned URL 서명에 host가 포함되므로 브라우저가 실제로 접근하는 공개 주소
      # (nginx가 /s3/ 로 프록시하는 rekit.co.kr)여야 함 — seaweedfs:8333은 도커 내부에서만
      # 통하는 호스트라 클라이언트가 접근 못 함 (S3_BUCKET 등 나머지 S3 설정도 .env에 있음).
      # seaweedfs 자체는 이 프로젝트가 띄우지 않고, rekit/seaweedfs (seaweedfs_default
      # 네트워크)에 떠있는 기존 인스턴스를 그대로 씀 — 중복 기동 방지.
    # nginx가 127.0.0.1:8000으로 리버스 프록시하는 구조 (todo.md 참고) — 외부 미노출
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # liveness 만 본다 — DB 장애 때 앱까지 unhealthy 로 재시작 반복하지 않게 (readiness 는 /health/ready)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - default
      - seaweedfs_default
      - rekit_edge
    # exec 로 sh 를 gunicorn 으로 교체 — sh 가 PID 1 로 남으면 docker stop 의 SIGTERM 이 gunicorn 에
    # 전달되지 않아 graceful_timeout 이 무의미하고, 10초 뒤 SIGKILL 로 처리 중 요청이 끊긴다
    command: >
      sh -c "alembic upgrade head &&
             exec gunicorn -c gunicorn.conf.py app.main:app"

networks:
  seaweedfs_default:
    external: true
  # nginx가 컨테이너명(rekle-app)으로 접근하기 위한 공유 네트워크 (rekit/nginx 참고)
  rekit_edge:
    external: true

volumes:
  postgres_data:
  redis_data:
